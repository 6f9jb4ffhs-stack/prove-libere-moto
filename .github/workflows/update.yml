name: Aggiorna calendario

on:
  schedule:
    - cron: "0 5 * * *"   # ogni giorno alle 05:00 UTC
  workflow_dispatch:       # permette di lanciarlo a mano dal pulsante "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Leggi i siti e aggiorna i dati
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento dati"
            git push
          fi
