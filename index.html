<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove libere moto in pista</title>
<style>
:root{
  --bg:#e9ecef; --surface:#fff; --ink:#14171a; --muted:#59626b; --line:#d5dade; --chip:#eef0f2;
  --kerb:#d7261e; --ok:#18794a; --warn:#b36b00; --bad:#9b3030; --none:#9aa3ab;
  --head:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1114;--surface:#1a1e23;--ink:#eceef0;--muted:#9ba4ac;--line:#2b3138;--chip:#252b32;--kerb:#ff5a4f;--ok:#4cc486;--warn:#e8a94a;--bad:#e58b8b;--none:#5d666e}
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.kerb{height:12px;background:repeating-linear-gradient(90deg,var(--kerb) 0 32px,var(--surface) 32px 64px)}
header{background:var(--ink);color:var(--bg)}
header div{max-width:820px;margin:0 auto;padding:22px 16px 20px}
h1{font:700 clamp(1.9rem,6vw,2.6rem)/1.05 var(--head);margin:0;letter-spacing:.01em}
#sub{margin:6px 0 0;opacity:.75}
main{max-width:820px;margin:0 auto;padding:16px 16px 56px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.filters{grid-template-columns:repeat(3,1fr)}}
select{width:100%;padding:11px 10px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
select:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--kerb);outline-offset:2px}
.opts{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 4px;color:var(--muted);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:center}
.opts button{font:inherit;color:var(--ink);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
ul{list-style:none;margin:0;padding:0}
.month{font:700 1.15rem/1 var(--head);margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.ev{position:relative;display:grid;grid-template-columns:64px 1fr;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--none);border-radius:10px;padding:14px 16px 14px 12px;margin-bottom:10px}
.ev.st-disponibile{border-left-color:var(--ok)}
.ev.st-lista_attesa{border-left-color:var(--warn)}
.ev.st-esaurito{border-left-color:var(--bad);opacity:.68}
.date{font-family:var(--head);text-align:center;line-height:1}
.date b{display:block;font-size:2.2rem}
.date span{display:block;font-size:1rem;color:var(--muted);margin-top:2px}
.date i{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.2}
.circuit{font:700 1.35rem/1.15 var(--head);margin:0}
.meta{color:var(--muted);font-size:.92rem;margin:3px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:10px}
.status{font-weight:700;font-size:.9rem}
.st-disponibile .status{color:var(--ok)} .st-lista_attesa .status{color:var(--warn)} .st-esaurito .status{color:var(--bad)} .st-non_indicata .status{color:var(--muted);font-weight:500}
.price{font:700 1.15rem/1 var(--head)}
.prices{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.notes{color:var(--muted);font-size:.85rem;margin:4px 0 0}
a.go{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.9rem;text-decoration:none}
@media (min-width:640px){
  .ev{grid-template-columns:72px 1fr auto}
  .side{grid-column:3;grid-row:1;text-align:right}
  .facts{margin-top:0;justify-content:flex-end;flex-direction:column;align-items:flex-end;gap:4px}
  .body{grid-column:2;grid-row:1}
}
.empty{padding:28px 8px;color:var(--muted);text-align:center}
.note{color:var(--muted);font-size:.85rem;margin:12px 0 0}
.warn{color:var(--warn);font-size:.9rem;margin:10px 0 0}
footer{color:var(--muted);font-size:.85rem;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="kerb" aria-hidden="true"></div>
<header><div>
  <h1>Prove libere moto in pista</h1>
  <p id="sub">Caricamento…</p>
</div></header>
<main>
  <div class="filters">
    <select id="f-org" aria-label="Organizzatore"></select>
    <select id="f-circuit" aria-label="Circuito"></select>
    <select id="f-month" aria-label="Mese"></select>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="f-hide"> Nascondi gli esauriti</label>
    <button id="reset" type="button">Azzera i filtri</button>
  </div>
  <div id="warn"></div>
  <ul id="list"></ul>
  <footer>I dati sono letti in automatico dai siti degli organizzatori con l'aiuto di un'AI e possono contenere errori. Controlla sempre date, prezzi e disponibilità sul sito dell'organizzatore prima di prenotare.
    <p id="updated" class="note"></p></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const LABEL = {disponibile:"Disponibile", lista_attesa:"Lista d'attesa", esaurito:"Esaurito", non_indicata:"Disponibilità non indicata"};
const SEL = {org:$("f-org"), circuit:$("f-circuit"), month:$("f-month")};
const ALL = {org:"Tutti gli organizzatori", circuit:"Tutti i circuiti", month:"Tutti i mesi"};
let events = [];

const day = s => new Date(s + "T00:00:00");
const monthKey = s => s.slice(0, 7);
const cap = t => t[0].toUpperCase() + t.slice(1);
const monthName = k => cap(day(k + "-01").toLocaleDateString("it-IT", {month:"long", year:"numeric"}));
const eur = n => n.toLocaleString("it-IT", {style:"currency", currency:"EUR", maximumFractionDigits:0});
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function fill(select, key, values, labeler = v => v) {
  const current = select.value;
  select.replaceChildren(new Option(ALL[key], ""));
  values.forEach(v => select.append(new Option(labeler(v), v)));
  select.value = values.includes(current) ? current : "";
}

function buildFilters() {
  const uniq = f => [...new Set(events.map(f).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it"));
  fill(SEL.org, "org", uniq(e => e.organizer));
  fill(SEL.circuit, "circuit", uniq(e => e.circuit));
  fill(SEL.month, "month", [...new Set(events.map(e => monthKey(e.date_start)))].sort(), monthName);
}

function visible() {
  return events.filter(e =>
    (!SEL.org.value || e.organizer === SEL.org.value) &&
    (!SEL.circuit.value || e.circuit === SEL.circuit.value) &&
    (!SEL.month.value || monthKey(e.date_start) === SEL.month.value || monthKey(e.date_end) === SEL.month.value) &&
    !($("f-hide").checked && e.availability === "esaurito"));
}

function card(e) {
  const a = day(e.date_start), b = day(e.date_end), multi = e.date_end !== e.date_start;
  const av = LABEL[e.availability] ? e.availability : "non_indicata";
  const li = el("li", "ev st-" + av);

  const d = el("div", "date");
  d.append(el("b", null, a.getDate()), el("span", null, a.toLocaleDateString("it-IT", {month:"short"})));
  if (multi) d.append(el("i", null, "fino al " + b.getDate() + " " + b.toLocaleDateString("it-IT", {month:"short"})));

  const body = el("div", "body");
  body.append(el("h2", "circuit", e.circuit), el("p", "meta", [e.organizer, e.event_type].filter(Boolean).join(", ")));
  if (e.prices.length > 1 || (e.prices[0] && e.prices[0].label))
    body.append(el("p", "prices", e.prices.map(p => (p.label ? p.label + ": " : "") + eur(p.amount_eur)).join("; ")));
  if (e.notes) body.append(el("p", "notes", e.notes));
  if (/^https?:\/\//.test(e.url)) {
    const link = el("a", "go", "Apri sul sito dell'organizzatore");
    link.href = e.url; link.target = "_blank"; link.rel = "noopener noreferrer";
    body.append(link);
  }

  const side = el("div", "side"), facts = el("div", "facts");
  if (e.prices.length) facts.append(el("span", "price", "da " + eur(Math.min(...e.prices.map(p => p.amount_eur)))));
  facts.append(el("span", "status", LABEL[av]));
  side.append(facts);

  li.append(d, body, side);
  return li;
}

function render() {
  const list = $("list"), rows = visible();
  list.replaceChildren();
  $("sub").textContent = rows.length + (rows.length === 1 ? " giornata trovata" : " giornate trovate");
  if (!rows.length) {
    list.append(el("li", "empty", events.length ? "Nessuna giornata con questi filtri. Prova ad azzerarli." : "Nessun dato disponibile. Il primo aggiornamento non è ancora stato eseguito."));
    return;
  }
  let last = "";
  for (const e of rows) {
    const k = monthKey(e.date_start);
    if (k !== last) { list.append(el("li", "month", monthName(k))); last = k; }
    list.append(card(e));
  }
}

function showStatus(data) {
  const failed = Object.entries(data.sources || {}).filter(([, s]) => !s.ok).map(([n]) => n);
  if (failed.length) $("warn").append(el("p", "warn", "Ultimo aggiornamento non riuscito per: " + failed.join(", ") + ". Per questi siti potresti vedere dati meno recenti o nessun dato."));
  if (data.updated) $("updated").textContent = "Dati aggiornati il " + new Date(data.updated).toLocaleString("it-IT", {dateStyle:"long", timeStyle:"short"});
}

Object.values(SEL).forEach(s => s.addEventListener("change", render));
$("f-hide").addEventListener("change", render);
$("reset").addEventListener("click", () => { Object.values(SEL).forEach(s => s.value = ""); $("f-hide").checked = false; render(); });

fetch("data/events.json", {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => { events = data.events || []; buildFilters(); showStatus(data); render(); })
  .catch(() => { $("sub").textContent = "Impossibile caricare i dati."; });
</script>
</body>
</html>
